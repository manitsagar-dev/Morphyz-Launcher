name: Build APK

# Every push to main (and every PR) builds a debug APK and attaches it as a
# downloadable artifact — grab it from the run's "Artifacts" section.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # so `git describe --tags` in build.gradle works
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install SDK packages (with NDK r27 fallback)
        run: |
          set -e
          # ubuntu-latest ships the Android SDK preinstalled; make sure sdkmanager is on PATH
          if ! command -v sdkmanager > /dev/null; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$PATH"
          fi
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          if sdkmanager "ndk;27.3.13750724"; then
            echo "NDK_VERSION=27.3.13750724" >> "$GITHUB_ENV"
          else
            echo "Exact NDK 27.3.13750724 not published — trying latest NDK r27 line"
            sdkmanager "ndk;27.2.12479018" || sdkmanager "ndk;27.1.12207171" || sdkmanager "ndk;27.0.12077973"
            INSTALLED=$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)
            echo "NDK_VERSION=$INSTALLED" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace -PndkVersion="${NDK_VERSION}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphyz-launcher-debug-apk
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
